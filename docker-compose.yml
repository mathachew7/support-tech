# Local dev stack: `docker compose up` runs the Next.js app + Postgres + a DB web UI.
# Or run only the DB (`docker compose up -d db`) and the app locally with `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    container_name: support-tech-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support_tech
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_tech"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: support-tech-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    container_name: support-tech-app
    env_file: .env
    environment:
      # Inside the compose network the DB host is `db`, not localhost.
      DATABASE_URL: "postgresql://support:support@db:5432/support_tech?schema=public"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  db_data:
