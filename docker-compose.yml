# Local dev stack. `docker compose up -d` gives you Postgres + a DB web UI.
# The `app` service is added during Phase 0 once Next.js is scaffolded (see PROGRESS.md).
services:
  db:
    image: postgres:16-alpine
    container_name: support-tech-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support_tech
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_tech"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: support-tech-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # app:  # enabled in Phase 0 (needs Dockerfile + package.json)
  #   build: .
  #   env_file: .env
  #   ports: ["3000:3000"]
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - .:/app
  #     - /app/node_modules

volumes:
  db_data:
